<style>

<script>
const P = JSON.parse(document.getElementById('data').textContent), $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches, NS = 'http://www.w3.org/2000/svg';
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
const CFG = @@CFG@@, W = CFG.w, PL = CFG.pl || {};
const plural = (n, w) => n + ' ' + (n === 1 ? w : (PL[w] || w + 's'));
const MORE = new Set();   /* topics whose second tier is showing */
const cnt = t => t.n || t.k.length;
function needMore(f){ const id = f.dataset.x; if(QRY || MORE.has(id) || (f.previousElementSibling && f.previousElementSibling.classList.contains('needmore'))) return;
  const b = el('button', 'needmore'); b.append(el('span', 'nm1', '@@MORE@@'), el('span', 'nm2', '@@MORENOTE@@'));
  b.onclick = e => { e.stopPropagation(); MORE.add(id); b.remove(); document.querySelectorAll('.fact.xtra[data-x="' + id + '"]').forEach((x, n) => { x.classList.remove('xtra'); x.style.setProperty('--n', n); x.classList.add('popin'); }); SND.tick(1.2); dispatchEvent(new Event('resize')); };   /* stems redraws its curves on resize */
  f.parentNode.insertBefore(b, f); }
new MutationObserver(() => document.querySelectorAll('.fact.xtra[data-x1]').forEach(needMore)).observe(document.documentElement, {childList: true, subtree: true});
function factEl(k, i){ const b = el('button', 'fact' + (k.m ? '' : ' nofold') + (k.x && !QRY && !MORE.has(k.x) ? ' xtra' : '')); if(k.x){ b.dataset.x = k.x; if(k.x1) b.dataset.x1 = '1'; } b.style.setProperty('--n', i);
  const m = el('span', 'more'); if(k.m) m.append(el('span', 'but', k.ml || 'But…'), el('span', 'lim', k.m));
  const say = el('span', 'say'); say.append(el('span', 'tx', k.f)); const cp = el('span', 'cp'); cp.setAttribute('role', 'button'); cp.tabIndex = 0; cp.title = 'Copy'; cp.setAttribute('aria-label', 'Copy this line');
  cp.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  const copy = e => { e.stopPropagation(); e.preventDefault(); try { navigator.clipboard.writeText(k.c || k.f).catch(() => {}); } catch(err){} cp.classList.add('ok'); SND.tick(1.5); setTimeout(() => cp.classList.remove('ok'), 1000); };
  cp.addEventListener('click', copy); cp.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') copy(e); }); say.append(cp);
  if(k.q){ const qe = el('span', 'q'), mt = k.q.match(/^([●◐◌−]\s+.+?)(\s+·\s+.*)?$/);   /* status words take their colour; the rest stays dim */
    if(mt){ qe.append(el('span', 'st st' + '●◐◌−'.indexOf(mt[1][0]), mt[1])); if(mt[2]) qe.append(mt[2]); } else qe.append(k.q); b.append(qe); } b.append(say, m); b.onclick = e => { if(e.target.closest('a,.cp') || !k.m) return; b.classList.toggle('open'); SND.tick(b.classList.contains('open') ? 1.1 : .9); }; return b; }
/* the little picture or sigil left of a name: d = depth (0 or 1) */
const PF = (() => { try { return JSON.parse(document.getElementById('pfps').textContent); } catch(e){ return {}; } })();
function ico(d, si, gi){ const v = d === 0 ? P[si].i : (P[si].u[gi] || {}).i; if(!v) return null; const s = el('span', 'ic');
  if(v[0] === '@'){ const src = PF[v.slice(1)]; if(src){ const im = el('img'); im.alt = ''; im.src = src; s.appendChild(im); s.classList.add('pf'); } else { s.textContent = (d === 0 ? P[si].n : P[si].u[gi].n)[0]; s.classList.add('pf', 'let'); } }
  else s.textContent = v; return s; }
